<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="2200" viewBox="0 0 800 2200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject x="0" y="0" width="800" height="2200">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:800px;min-height:2200px;background-color:white;">

<style>
	@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;family=Syne:wght@400;500;700&amp;display=swap');
	@import url('https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css');
	* {
		box-sizing: border-box;
		margin: 0;
		padding: 0;
	}
	:root {
		--ink: #0a0a0a;
		--paper: #f8f6f1;
		--muted: #6b6b6b;
		--accent: #1a1a2e;
		--tag-bg: #efefea;
		--tag-text: #333;
		--border: #d8d4cc;
		--highlight: #e8462a;
	}
	body {
		background: var(--paper);
		color: var(--ink);
		font-family: 'Syne', sans-serif;
		line-height: 1.6;
		min-height: 100vh;
	}
	.mono {
		font-family: 'JetBrains Mono', monospace;
	}
	.serif {
		font-family: 'DM Serif Display', serif;
	}

	.wrap {
		max-width: 680px;
		margin: 0 auto;
		padding: 0 0 4rem;
	}

	.hero {
		padding: 3rem 0 2.5rem;
		border-bottom: 1px solid var(--border);
	}
	.hero-eyebrow {
		font-family: 'JetBrains Mono', monospace;
		font-size: 11px;
		letter-spacing: 0.12em;
		color: var(--muted);
		text-transform: uppercase;
		margin-bottom: 1.2rem;
	}
	.hero-name {
		font-family: 'DM Serif Display', serif;
		font-size: 48px;
		line-height: 1.05;
		font-weight: 400;
		margin-bottom: 0.5rem;
	}
	.hero-name em {
		font-style: italic;
		color: var(--highlight);
	}
	.hero-title {
		font-size: 14px;
		font-weight: 500;
		color: var(--muted);
		letter-spacing: 0.04em;
		margin-bottom: 1.5rem;
	}
	.hero-bio {
		font-size: 15px;
		color: #3a3a3a;
		max-width: 520px;
		line-height: 1.75;
		margin-bottom: 2rem;
	}
	.hero-stats {
		display: flex;
		gap: 2rem;
	}
	.stat {
		text-align: left;
	}
	.stat-num {
		font-family: 'DM Serif Display', serif;
		font-size: 28px;
		font-weight: 400;
	}
	.stat-label {
		font-size: 11px;
		color: var(--muted);
		font-family: 'JetBrains Mono', monospace;
		letter-spacing: 0.08em;
		text-transform: uppercase;
	}

	.section {
		padding: 2rem 0;
		border-bottom: 1px solid var(--border);
	}
	.section-label {
		font-family: 'JetBrains Mono', monospace;
		font-size: 10px;
		letter-spacing: 0.14em;
		text-transform: uppercase;
		color: var(--muted);
		margin-bottom: 1.5rem;
	}

	.services-grid {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 1px;
		background: var(--border);
		border: 1px solid var(--border);
	}
	.service-card {
		background: var(--paper);
		padding: 1.25rem;
		transition: background 0.15s;
	}
	.service-card:hover {
		background: #f0ede4;
	}
	.service-icon {
		font-size: 18px;
		margin-bottom: 0.6rem;
	}
	.service-title {
		font-family: 'Syne', sans-serif;
		font-size: 14px;
		font-weight: 700;
		margin-bottom: 0.4rem;
	}
	.service-desc {
		font-size: 12px;
		color: var(--muted);
		line-height: 1.6;
	}
	.service-rate {
		font-family: 'JetBrains Mono', monospace;
		font-size: 11px;
		color: var(--highlight);
		margin-top: 0.5rem;
		font-weight: 500;
	}

	.stack-row {
		display: flex;
		flex-wrap: wrap;
		gap: 6px;
		margin-bottom: 1rem;
	}
	.tag {
		display: inline-block;
		padding: 4px 10px;
		background: var(--tag-bg);
		color: var(--tag-text);
		font-family: 'JetBrains Mono', monospace;
		font-size: 11px;
		border-radius: 2px;
	}
	.tag.primary {
		background: #1a1a2e;
		color: #e8e8e8;
	}
	.stack-category {
		font-size: 11px;
		color: var(--muted);
		font-family: 'JetBrains Mono', monospace;
		letter-spacing: 0.08em;
		text-transform: uppercase;
		margin-bottom: 0.5rem;
		margin-top: 1rem;
	}
	.stack-category:first-child {
		margin-top: 0;
	}

	.work-item {
		padding: 1.25rem 0;
		border-bottom: 0.5px solid var(--border);
	}
	.work-item:last-child {
		border-bottom: none;
	}
	.work-header {
		display: flex;
		justify-content: space-between;
		align-items: flex-start;
		margin-bottom: 0.4rem;
	}
	.work-title {
		font-weight: 700;
		font-size: 14px;
	}
	.work-type {
		font-family: 'JetBrains Mono', monospace;
		font-size: 10px;
		color: var(--muted);
		letter-spacing: 0.06em;
		text-transform: uppercase;
		padding: 2px 7px;
		background: var(--tag-bg);
		border-radius: 2px;
	}
	.work-desc {
		font-size: 13px;
		color: #4a4a4a;
		line-height: 1.65;
		margin-bottom: 0.6rem;
	}
	.work-tags {
		display: flex;
		gap: 5px;
		flex-wrap: wrap;
	}
	.work-tag {
		font-family: 'JetBrains Mono', monospace;
		font-size: 10px;
		color: var(--muted);
		background: #ebebeb;
		padding: 2px 7px;
		border-radius: 2px;
	}

	.platforms-grid {
		display: grid;
		grid-template-columns: 1fr 1fr 1fr;
		gap: 8px;
	}
	.platform-card {
		background: var(--paper);
		border: 1px solid var(--border);
		padding: 0.9rem 1rem;
		cursor: pointer;
		transition: all 0.15s;
		border-radius: 2px;
	}
	.platform-card:hover {
		border-color: #888;
		background: #f0ede4;
	}
	.platform-card.top {
		border-color: var(--highlight);
	}
	.platform-name {
		font-size: 13px;
		font-weight: 700;
		margin-bottom: 2px;
	}
	.platform-desc {
		font-size: 11px;
		color: var(--muted);
		line-height: 1.5;
	}
	.platform-badge {
		font-family: 'JetBrains Mono', monospace;
		font-size: 9px;
		color: var(--highlight);
		text-transform: uppercase;
		letter-spacing: 0.08em;
		margin-top: 4px;
	}

	.bio-block {
		background: #1a1a2e;
		color: #e8e8e8;
		padding: 2rem;
		margin: 2rem 0 0;
		border-radius: 2px;
	}
	.bio-block .bio-label {
		font-family: 'JetBrains Mono', monospace;
		font-size: 10px;
		letter-spacing: 0.14em;
		text-transform: uppercase;
		color: #8888aa;
		margin-bottom: 1rem;
	}
	.bio-block .bio-text {
		font-size: 14px;
		line-height: 1.8;
		color: #d8d8e8;
	}
	.copy-btn {
		margin-top: 1rem;
		padding: 7px 14px;
		background: transparent;
		border: 1px solid #445;
		color: #aaa;
		font-family: 'JetBrains Mono', monospace;
		font-size: 11px;
		cursor: pointer;
		border-radius: 2px;
		transition: all 0.15s;
	}
	.copy-btn:hover {
		background: #2a2a4e;
		color: #e8e8e8;
		border-color: #667;
	}

	.rate-block {
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 1px;
		background: var(--border);
		border: 1px solid var(--border);
		margin-top: 1rem;
	}
	.rate-item {
		background: var(--paper);
		padding: 1rem 1.25rem;
	}
	.rate-label {
		font-family: 'JetBrains Mono', monospace;
		font-size: 10px;
		color: var(--muted);
		text-transform: uppercase;
		letter-spacing: 0.08em;
		margin-bottom: 0.3rem;
	}
	.rate-value {
		font-family: 'DM Serif Display', serif;
		font-size: 22px;
		font-weight: 400;
	}
	.rate-note {
		font-size: 11px;
		color: var(--muted);
		margin-top: 2px;
	}
	.connect-list {
		display: flex;
		flex-direction: column;
		gap: 10px;
	}
	.connect-item {
		display: flex;
		align-items: center;
		gap: 14px;
		padding: 10px 14px;
		border: 0.5px solid var(--border);
		border-radius: 2px;
		text-decoration: none;
		color: var(--ink);
		transition:
			background 0.15s,
			border-color 0.15s;
		background: var(--paper);
	}
	.connect-item:hover {
		background: #f0ede4;
		border-color: #999;
	}
	.connect-icon {
		width: 32px;
		height: 32px;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #1a1a2e;
		border-radius: 2px;
		flex-shrink: 0;
	}
	.connect-icon svg {
		width: 16px;
		height: 16px;
		fill: #e8e8e8;
	}
	.connect-platform {
		font-family: 'JetBrains Mono', monospace;
		font-size: 12px;
		font-weight: 500;
		color: var(--muted);
		text-transform: uppercase;
		letter-spacing: 0.08em;
		width: 90px;
		flex-shrink: 0;
	}
	.connect-url {
		font-family: 'JetBrains Mono', monospace;
		font-size: 12px;
		color: #3a3a3a;
	}
	.connect-arrow {
		margin-left: auto;
		font-family: 'JetBrains Mono', monospace;
		font-size: 12px;
		color: var(--muted);
	}
</style>

<div class="wrap">
	<div class="hero">
		<div class="hero-eyebrow">
			Available for freelance · Remote · Worldwide
		</div>
		<h1 class="hero-name">Rishi<br /><em>Builds</em> Things</h1>
		<div class="hero-title">
			Full-Stack Engineer · AI Integration Specialist · Technical Lead
		</div>
		<p class="hero-bio">
			I ship production-grade software — MVPs, AI-powered features, and
			full-stack platforms. I've led technical delivery on client
			engagements across Django, React, Go, and Spring Boot, and I handle
			everything from architecture to deployment.
		</p>
		<div class="hero-stats">
			<div class="stat">
				<div class="stat-num">2+</div>
				<div class="stat-label">Years shipping</div>
			</div>
			<div class="stat">
				<div class="stat-num">5</div>
				<div class="stat-label">Core stacks</div>
			</div>
		</div>
	</div>

	<div class="section">
		<div class="section-label">What I do</div>
		<div class="services-grid">
			<div class="service-card">
				<div class="service-icon">
					<i class="ti ti-rocket" aria-hidden="true"></i>
				</div>
				<div class="service-title">MVP Development</div>
				<div class="service-desc">
					Full-stack MVPs from scratch. Django + React, Next.js, Go
					APIs. Auth, payments, deploy.
				</div>
			</div>
			<div class="service-card">
				<div class="service-icon">
					<i class="ti ti-brain" aria-hidden="true"></i>
				</div>
				<div class="service-title">AI Integration</div>
				<div class="service-desc">
					LLM features, RAG pipelines, AI dashboards. Langfuse,
					OpenAI, Anthropic, Snowflake Cortex.
				</div>
			</div>
			<div class="service-card">
				<div class="service-icon">
					<i class="ti ti-api" aria-hidden="true"></i>
				</div>
				<div class="service-title">Backend / API Engineering</div>
				<div class="service-desc">
					REST &amp; gRPC APIs, Go microservices, Spring Boot, Celery
					workers, AWS infra.
				</div>
			</div>
			<div class="service-card">
				<div class="service-icon">
					<i class="ti ti-layout" aria-hidden="true"></i>
				</div>
				<div class="service-title">Frontend Engineering</div>
				<div class="service-desc">
					React, Next.js, Vite. Pixel-perfect UI with Tailwind, Framer
					Motion, GSAP animations.
				</div>
			</div>
		</div>
	</div>

	<div class="section">
		<div class="section-label">Tech stack</div>
		<div class="stack-category">Languages</div>
		<div class="stack-row">
			<span class="tag primary">Go</span>
			<span class="tag primary">TypeScript</span>
			<span class="tag primary">Python</span>
			<span class="tag primary">Java</span>
			<span class="tag primary">JavaScript</span>
		</div>
		<div class="stack-category">Frontend</div>
		<div class="stack-row">
			<span class="tag primary">React.js</span>
			<span class="tag primary">Next.js</span>
			<span class="tag primary">Angular</span>
			<span class="tag primary">Vue.js</span>
			<span class="tag primary">Vite</span>
			<span class="tag primary">Tailwind</span>
			<span class="tag primary">Framer Motion</span>
			<span class="tag primary">GSAP</span>
		</div>
		<div class="stack-category">Backend</div>
		<div class="stack-row">
			<span class="tag primary">Django DRF</span>
			<span class="tag primary">Spring Boot</span>
			<span class="tag primary">gRPC / ConnectRPC</span>
			<span class="tag primary">Celery</span>
			<span class="tag primary">Prisma</span>
			<span class="tag primary">GORM</span>
		</div>
		<div class="stack-category">Infra / AI</div>
		<div class="stack-row">
			<span class="tag primary">AWS</span>
			<span class="tag primary">Docker</span>
			<span class="tag primary">PostgreSQL</span>
			<span class="tag primary">Langfuse</span>
			<span class="tag primary">Google Cloud</span>
			<span class="tag primary">Auth0</span>
			<span class="tag primary">Azure</span>
		</div>
	</div>

	<div class="section">
		<div class="section-label">Connect</div>
		<div class="connect-list">
			<a
				class="connect-item"
				href="https://github.com/rishilahoti"
				target="_blank"
			>
				<div class="connect-icon">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
						<path
							d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
						/>
					</svg>
				</div>
				<span class="connect-platform">GitHub</span>
				<span class="connect-url">github.com/rishilahoti</span>
				<span class="connect-arrow">&#x2197;</span>
			</a>

			<a
				class="connect-item"
				href="https://www.linkedin.com/in/rishi-lahoti-665889166/"
				target="_blank"
			>
				<div class="connect-icon">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
						<path
							d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
						/>
					</svg>
				</div>
				<span class="connect-platform">LinkedIn</span>
				<span class="connect-url">rishi-lahoti-665889166</span>
				<span class="connect-arrow">&#x2197;</span>
			</a>

			<a
				class="connect-item"
				href="https://twitter.com/rishii_lahoti"
				target="_blank"
			>
				<div class="connect-icon">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
						<path
							d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
						/>
					</svg>
				</div>
				<span class="connect-platform">X / Twitter</span>
				<span class="connect-url">@rishii_lahoti</span>
				<span class="connect-arrow">&#x2197;</span>
			</a>
		</div>
	</div>
</div>

    </div>
  </foreignObject>
</svg>
